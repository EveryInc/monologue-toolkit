version: 2

project_name: monologue

builds:
  - id: monologue
    binary: monologue
    main: ./cli/cmd/monologue
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/EveryInc/monologue-toolkit/cli/internal/version.Version={{ .Version }}
      - -X github.com/EveryInc/monologue-toolkit/cli/internal/version.Commit={{ .Commit }}
      - -X github.com/EveryInc/monologue-toolkit/cli/internal/version.Date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: monologue
    builds:
      - monologue
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

release:
  draft: false

